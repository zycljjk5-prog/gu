<!DOCTYPE html>
<!-- saved from url=(0046)https://web.yanshu.net/Markdowntorichtext.html -->
<html lang="zh"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 转富文本</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .editor {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .preview {
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-height: 200px;
            background-color: #f9f9f9;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 0.5rem;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        button {
            padding: 0.5rem 1rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #45a049;
        }
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body inject_video_svd="true">
    <header>
        <h1>Markdown 转富文本</h1>
    </header>
    <div class="container">
        <div class="editor">
            <textarea id="markdown" placeholder="在此输入 Markdown 文本..."></textarea>
            <button id="copyBtn">复制富文本</button>
            <div class="preview" id="preview"></div>
        </div>
    </div>
    <footer>
        <p>© 2025 Markdown 转富文本工具</p>
    </footer>

    <script>
        const markdownInput = document.getElementById("markdown");
        const previewDiv = document.getElementById("preview");
        const copyBtn = document.getElementById("copyBtn");

        // 实时转换 Markdown 为富文本
        markdownInput.addEventListener("input", () => {
            const markdown = markdownInput.value;
            if (typeof marked !== 'undefined') {
                previewDiv.innerHTML = marked.parse(markdown);
            } else {
                previewDiv.innerHTML = '<p style="color:red;">Marked.js 加载失败，请刷新页面重试</p>';
            }
        });

        // 复制富文本
        copyBtn.addEventListener("click", () => {
            const range = document.createRange();
            range.selectNode(previewDiv);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand("copy");
            window.getSelection().removeAllRanges();
            alert("富文本已复制到剪贴板！");
        });
    </script>
    <script>
        function loadMarked() {
            const script = document.createElement('script');
            script.src = 'https://web.yanshu.net/markdown.js';
            script.onload = () => {
                if (typeof marked !== 'undefined') {
                    console.log('Marked.js 加载成功');
                } else {
                    console.error('Marked.js 加载失败，尝试备用方案');
                    loadFallbackMarked();
                }
            };
            script.onerror = () => {
                console.error('Marked.js 加载失败，尝试备用方案');
                loadFallbackMarked();
            };
            document.head.appendChild(script);
        }

        function loadFallbackMarked() {
            const fallbackScript = document.createElement('script');
            fallbackScript.src = 'https://knightyun.github.io/markdown-to-richtext/js/index.js';
            fallbackScript.onload = () => {
                if (typeof marked !== 'undefined') {
                    console.log('备用 Marked.js 加载成功');
                } else {
                    console.error('备用 Marked.js 加载失败');
                    document.getElementById('preview').innerHTML = '<p style="color:red;">Marked.js 加载失败，请检查网络或刷新页面</p>';
                }
            };
            fallbackScript.onerror = () => {
                console.error('备用 Marked.js 加载失败');
                document.getElementById('preview').innerHTML = '<p style="color:red;">Marked.js 加载失败，请检查网络或刷新页面</p>';
            };
            document.head.appendChild(fallbackScript);
        }

        loadMarked();
    </script>

</html>
