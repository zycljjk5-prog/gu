    <header>
        <h1>Markdown 转富文本</h1>
    </header>
    <div class="container">
        <div class="editor">
            <textarea id="markdown" placeholder="在此输入 Markdown 文本..."></textarea>
            <button id="copyBtn">复制富文本</button>
            <div class="preview" id="preview"></div>
        </div>
    </div>
    <footer>
        <p>© 2025 Markdown 转富文本工具</p>
    </footer>

    <script>
        const markdownInput = document.getElementById("markdown");
        const previewDiv = document.getElementById("preview");
        const copyBtn = document.getElementById("copyBtn");

        // 实时转换 Markdown 为富文本
        markdownInput.addEventListener("input", () => {
            const markdown = markdownInput.value;
            previewDiv.innerHTML = marked.parse(markdown);
        });

        // 复制富文本
        copyBtn.addEventListener("click", () => {
            const range = document.createRange();
            range.selectNode(previewDiv);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand("copy");
            window.getSelection().removeAllRanges();
            alert("富文本已复制到剪贴板！");
        });
    </script>
    <script src="./Markdown 转富文本_files/marked.min.js.下载"></script>
