
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>在线中国儿童BMI计算器</title>
  <style>
    :root { --blue: #1e88e5; --dark: #1565c0; --muted: #666; }
    body { font-family: "Microsoft YaHei", Segoe UI, Helvetica, Arial, sans-serif; background: #f6f9fc; margin: 0; color: #222; }
    header { background: linear-gradient(90deg, var(--blue), #42a5f5); color: #fff; padding: 18px 16px; text-align: center; font-weight: 700; }
    .container { max-width: 800px; margin: 18px auto; padding: 12px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); padding: 16px; margin-bottom: 14px; }
    h2 { color: var(--dark); margin: 6px 0 10px; }
    .desc { color: var(--muted); font-size: 0.92rem; margin-bottom: 10px; }
    label { display: block; margin-top: 8px; font-size: 0.88rem; color: #333; }
    input, select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #dfe7f5; margin-top: 6px; box-sizing: border-box; }
    .btn { display: inline-block; background: var(--blue); color: #fff; padding: 8px 12px; border-radius: 8px; border: none; cursor: pointer; margin-top: 10px; text-decoration: none; }
    .result { background: #fff; padding: 10px; border-radius: 8px; margin-top: 8px; border: 1px dashed #e1efff; }
    .small { font-size: 0.85rem; color: #555; }
  </style>
</head>
<body>
  <header>在线中国儿童BMI计算器</header>
  <div class="container">
    <div class="card">
      <h2>BMI & 百分位估算</h2>
      <p class="desc">输入儿童年龄、性别、体重和身高，计算BMI并估算百分位。</p>

      <label>儿童年龄（岁，支持小数）<input type="number" id="age" step="0.1" value="8" onchange="updateReferenceValues()"></label>
      <label>性别<select id="sex" onchange="updateReferenceValues()"><option value="M">男</option><option value="F">女</option></select></label>
      <label>体重（kg）<input type="number" id="weight" step="0.1" value="25" onchange="calcBMI()"></label>
      <label>身高（cm）<input type="number" id="height" step="0.1" value="120" onchange="calcBMI()"></label>
      <label>参考 BMI 均值（mean）<input type="number" id="bmiMean" step="0.01" placeholder="自动填充" readonly></label>
      <label>参考 BMI SD <input type="number" id="bmiSD" step="0.01" placeholder="自动填充" readonly></label>
      <button class="btn" onclick="calcBMI()">计算 BMI</button>
      <div id="bmiResult" class="result" style="display:none"></div>
    </div>
  </div>

  <script>
    // 中国儿童BMI参考数据（年龄、性别对应的均值和标准差）
    const bmiReferenceData = {
      M: {
        bmi: {
          1: { mean: 16.1, sd: 1.3 },
          2: { mean: 15.8, sd: 1.2 },
          3: { mean: 15.4, sd: 1.1 },
          4: { mean: 15.2, sd: 1.0 },
          5: { mean: 15.1, sd: 0.9 },
          6: { mean: 15.0, sd: 0.9 },
          7: { mean: 14.9, sd: 0.9 },
          8: { mean: 14.8, sd: 0.9 },
          9: { mean: 14.7, sd: 0.9 },
          10: { mean: 14.6, sd: 0.9 },
          11: { mean: 14.5, sd: 0.9 },
          12: { mean: 14.4, sd: 0.9 },
          13: { mean: 14.3, sd: 0.9 },
          14: { mean: 14.2, sd: 0.9 },
          15: { mean: 14.1, sd: 0.9 },
          16: { mean: 14.0, sd: 0.9 },
          17: { mean: 13.9, sd: 0.9 },
          18: { mean: 13.8, sd: 0.9 }
        }
      },
      F: {
        bmi: {
          1: { mean: 15.8, sd: 1.2 },
          2: { mean: 15.4, sd: 1.1 },
          3: { mean: 15.0, sd: 1.0 },
          4: { mean: 14.8, sd: 0.9 },
          5: { mean: 14.7, sd: 0.9 },
          6: { mean: 14.6, sd: 0.9 },
          7: { mean: 14.5, sd: 0.9 },
          8: { mean: 14.4, sd: 0.9 },
          9: { mean: 14.3, sd: 0.9 },
          10: { mean: 14.2, sd: 0.9 },
          11: { mean: 14.1, sd: 0.9 },
          12: { mean: 14.0, sd: 0.9 },
          13: { mean: 13.9, sd: 0.9 },
          14: { mean: 13.8, sd: 0.9 },
          15: { mean: 13.7, sd: 0.9 },
          16: { mean: 13.6, sd: 0.9 },
          17: { mean: 13.5, sd: 0.9 },
          18: { mean: 13.4, sd: 0.9 }
        }
      }
    };

    // 更新BMI参考均值和标准差
    function updateReferenceValues() {
      const age = parseFloat(document.getElementById('age').value);
      const sex = document.getElementById('sex').value;

      if (!age || !sex) return;

      const roundedAge = Math.floor(age);
      const data = bmiReferenceData[sex].bmi[roundedAge];

      if (data) {
        document.getElementById('bmiMean').value = data.mean;
        document.getElementById('bmiSD').value = data.sd;
      }
    }

    // 计算BMI
    function calcBMI() {
      const weight = parseFloat(document.getElementById('weight').value);
      const height = parseFloat(document.getElementById('height').value);
      const mean = parseFloat(document.getElementById('bmiMean').value);
      const sd = parseFloat(document.getElementById('bmiSD').value);
      const resultDiv = document.getElementById('bmiResult');

      if (isNaN(weight) || isNaN(height) || height <= 0) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<strong>错误：</strong> 请确保已输入体重和身高。';
        return;
      }

      const bmi = weight / Math.pow(height / 100, 2);
      let resultText = `<div><strong>BMI：</strong>${round(bmi, 2)}</div>`;

      if (!isNaN(mean) && !isNaN(sd) && sd > 0) {
        const z = (bmi - mean) / sd;
        const p = zToPercentile(z);
        resultText += `<div class="small">近似百分位：${(p * 100).toFixed(1)}%</div>`;
      }

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = resultText;
    }

    // 工具函数
    function round(v, d) { return Math.round(v * Math.pow(10, d)) / Math.pow(10, d); }
    function zToPercentile(z) { // 使用标准正态分布 CDF (approx)
      return phi(z);
    }
    function phi(x) { // normal CDF approximation (Abramowitz-Stegun)
      var t = 1 / (1 + 0.2316419 * Math.abs(x));
      var d = 0.3989423 * Math.exp(-x * x / 2);
      var p = d * (0.3193815 * t - 0.3565638 * Math.pow(t, 2) + 1.781478 * Math.pow(t, 3) - 1.821256 * Math.pow(t, 4) + 1.330274 * Math.pow(t, 5));
      if (x > 0) return 1 - p; else return p;
    }
  </script>
</body>
</html><script>
(function() {
  var ws = new WebSocket('ws://' + window.location.host + 
             '/jb-server-page?reloadMode=RELOAD_ON_SAVE&'+
             'referrer=' + encodeURIComponent(window.location.pathname));
  ws.onmessage = function (msg) {
      if (msg.data === 'reload') {
          window.location.reload();
      }
      if (msg.data.startsWith('update-css ')) {
          var messageId = msg.data.substring(11);
          var links = document.getElementsByTagName('link');
          for (var i = 0; i < links.length; i++) {
              var link = links[i];
              if (link.rel !== 'stylesheet') continue;
              var clonedLink = link.cloneNode(true);
              var newHref = link.href.replace(/(&|\?)jbUpdateLinksId=\d+/, "$1jbUpdateLinksId=" + messageId);
              if (newHref !== link.href) {
                clonedLink.href = newHref;
              }
              else {
                var indexOfQuest = newHref.indexOf('?');
                if (indexOfQuest >= 0) {
                  // to support ?foo#hash 
                  clonedLink.href = newHref.substring(0, indexOfQuest + 1) + 'jbUpdateLinksId=' + messageId + '&' + 
                                    newHref.substring(indexOfQuest + 1);
                }
                else {
                  clonedLink.href += '?' + 'jbUpdateLinksId=' + messageId;
                }
              }
              link.replaceWith(clonedLink);
          }
      }
  };
})();
</script>
