*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{

.wrap{max-width:1000px;margin:0 auto}
header{text-align:center;margin-bottom:22px}
header .kicker{font-size:12px;letter-spacing:.18em;color:var(--brand);font-weight:600;margin-bottom:8px}
h1{font-size:clamp(20px,3.5vw,26px);font-weight:700;letter-spacing:.01em}

.grid{display:grid;grid-template-columns:1fr;gap:16px}

.card{background:var(--card);border-radius:14px;box-shadow:0 1px 0 #fff inset,0 8px 24px rgba(28,43,51,.06);border:1px solid var(--line);padding:20px}
.card h2{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--brand);display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--brand)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field .hint{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px}
.ages{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.sex{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sex button{padding:11px;border:1px solid var(--line);border-radius:9px;background:#FBFCFE;font-size:15px;cursor:pointer;color:var(--ink);font-weight:600}
.sex button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cta{width:100%;padding:13px;border:none;border-radius:9px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px}
.cta:active{background:var(--brand-d)}
.result{display:none}
.result.show{display:block}
.heroband{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px dashed var(--line)}
.bmi-big{font-size:46px;font-weight:800;line-height:1}
.bmi-big small{font-size:14px;font-weight:600;color:var(--mut);margin-left:4px}
.badge{font-size:15px;font-weight:700;padding:7px 14px;border-radius:999px;color:#fff}
.badge.normal{background:var(--ok)}.badge.over{background:var(--over)}.badge.c1{background:var(--c1)}.badge.c2{background:var(--c2)}.badge.c3{background:var(--c3)}
.sev{margin-top:10px;font-size:13px;font-weight:700;color:var(--c2)}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:12px}
td b{font-weight:700}
td .bar{height:6px;border-radius:3px;margin-top:6px;background:var(--line)}
td .bar i{display:block;height:100%;border-radius:3px}
.note{margin-top:14px;font-size:12px;color:var(--mut);line-height:1.6}
.note b{color:var(--ink)}
.chartbox{height:300px;width:100%}

</head>
<body>
<div class="wrap">
<header>
  <div class="kicker">CLINICAL CALCULATOR</div>
  <h1>CDC-2000 儿童肥胖分级计算器</h1>
  <p>适用 2–12 岁 · BMI-for-Age · 数据源 CDC/NCHS 2000 生长曲线（LMS 参数，按月插值）</p>
</header>

<div class="grid">
  <div class="card">
    <h2>输入参数</h2>
    <div class="field">
      <label>性别 <span class="hint">按 CDC 分性别曲线</span></label>
      <div class="sex">
        <button id="sexBoy" type="button" class="on">男孩</button>
        <button id="sexGirl" type="button">女孩</button>
      </div>
    </div>
    <div class="field">
      <label>年龄 <span class="hint">周岁 + 月份</span></label>
      <div class="ages">
        <select id="ageYr"></select>
        <select id="ageMo"></select>
      </div>
    </div>
    <div class="field">
      <label>身高 <span class="hint">厘米</span></label>
      <input id="h" type="number" min="60" max="180" step="0.1" placeholder="例如 132.5" inputmode="decimal" />
</div>
    <div class="field">
      <label>体重 <span class="hint">千克</span></label>
      <input id="w" type="number" min="8" max="120" step="0.1" placeholder="例如 42.0" inputmode="decimal" />
    </div>
    <button class="cta" id="calc">计算肥胖分级</button>
    <div class="err" id="err"></div>
  </div>

  <div class="card">
    <h2>评估结果</h2>
    <div class="result" id="result"></div>
    <div class="chartbox" id="chart"></div>
  </div>
</div>

<footer>
  本工具依据 CDC 2000 生长曲线分级，仅供临床参考，不能替代医师综合诊断。分级判定中 2/3 级与重度肥胖的「BMI≥35/40 取较低值」规则已在 2–12 岁范围内实现。有错误可以联系作者修正。张永超医生设计。
</footer>
</div>

  const s=x<0?-1:1;x=Math.abs(x);
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;

  return s*y;
}
function normCdf(z){return 0.5*(1+erf(z/Math.SQRT2));}
// ---- LMS 按月线性插值 ----
function interp(table, months){
  if(months<=table[0][0])return table[0];
  if(months>=table[table.length-1][0])return table[table.length-1];
  for(let i=0;i<table.length-1;i++){
    const a=table[i],b=table[i+1];
    if(months>=a[0]&&months<=b[0]){
      const t=(months-a[0])/(b[0]-a[0]);
      return [months, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t, a[3]+(b[3]-a[3])*t];
    }
  }
  return table[table.length-1];
}

// 由 LMS 求给定 z 对应的 BMI：X = M(1+LSZ)^(1/L)
function bmiAtZ(l,m,s,z){
  if(Math.abs(l)<1e-8)return m*Math.exp(s*z);
  return m*Math.pow(1+l*s*z, 1/l);
}
// 由 BMI 求 z 与百分位
function zFromBMI(l,m,s,bmi){
  if(Math.abs(l)<1e-8)return Math.log(bmi/m)/s;
  return (Math.pow(bmi/m, l)-1)/(l*s);
}

const Z85=1.036, Z95=1.645;

function compute(){
  const sex=state.sex;
  const months=state.yr*12+state.mo;
  const h=parseFloat(document.getElementById('h').value);
  const w=parseFloat(document.getElementById('w').value);
  const err=document.getElementById('err');
err.style.display='none';
  document.getElementById('result').className='result';
  if(isNaN(h)||isNaN(w)||h<=0||w<=0){err.textContent='请填写有效的身高和体重。';err.style.display='block';return;}
  if(h<60||h>200){err.textContent='身高超出常见范围（60–200 cm），请核对。';err.style.display='block';return;}
  if(w<5||w>150){err.textContent='体重超出常见范围（5–150 kg），请核对。';err.style.display='block';return;}
  if(months<24||months>144){err.textContent='本计算器仅适用 2–12 岁（24–144 月龄）。';err.style.display='block';return;}

  const bmi=w/Math.pow(h/100,2);
  const table=sex==='boy'?BOYS:GIRLS;
  const [ag,l,m,s]=interp(table, months);
  const P85=bmiAtZ(l,m,s,Z85);
  const P95=bmiAtZ(l,m,s,Z95);
  const thr120=1.20*P95, thr140=1.40*P95;
  const lvl2Lo=Math.min(thr120,35), lvl2Hi=Math.min(thr140,40);
  const lvl3Lo=Math.min(thr140,40);
  const sevLo=Math.min(thr120,35);
  const z=zFromBMI(l,m,s,bmi);
  const pct=normCdf(z)*100;

  // 分级
  let grade, cls, label;
  if(bmi<P85){grade='正常体重';cls='normal';}
  else if(bmi<P95){grade='超重';cls='over';}
else if(bmi<thr120){grade='肥胖 · 1级';cls='c1';}
  else if(bmi<lvl2Hi){grade='肥胖 · 2级';cls='c2';}
  else {grade='肥胖 · 3级';cls='c3';}
  const severe = bmi>=sevLo;

  // 等级在 85→95→120→140 谱带上的位置（用于结果条）
  const segs=[{v:0,t:'P85'},{v:P85,t:'P85'},{v:P95,t:'P95'},{v:thr120,t:'120%'},{v:Math.max(thr120,thr140),t:'140%'}];
  const maxX=Math.max(thr140, bmi*1.02);
  const p85p=(P85/maxX)*100, p95p=(P95/maxX)*100, p120p=(thr120/maxX)*100;

  let out='';
  out+='<div class="heroband">';
  out+='<div class="bmi-big">'+bmi.toFixed(2)+'<small>kg/m²</small></div>';
  out+='<div class="badge '+cls+'">'+grade+'</div>';
  out+='</div>';
  out+='<table>';
  out+='<tr><th>指标</th><th>本患儿</th><th>百分位/阈值</th></tr>';
  out+='<tr><td>BMI</td><td><b>'+bmi.toFixed(2)+'</b></td><td>约 P'+pct.toFixed(1)+'（'+z.toFixed(2)+' SD）</td></tr>';
  out+='<tr><td>年龄性别</td><td>'+state.yr+'岁'+state.mo+'个月 · '+ (sex==='boy'?'男':'女') +'</td><td>月龄 '+months+'</td></tr>';
  out+='<tr><td>P85 界值</td><td>'+P85.toFixed(2)+'</td><td>超重起点</td></tr>';
out+='<tr><td>P95 界值</td><td>'+P95.toFixed(2)+'</td><td>肥胖起点</td></tr>';
  out+='<tr><td>120% × P95</td><td>'+thr120.toFixed(2)+'</td><td>重度肥胖（或 BMI≥35）</td></tr>';
  out+='<tr><td>140% × P95</td><td>'+thr140.toFixed(2)+'</td><td>3级肥胖（或 BMI≥40）</td></tr>';
  out+='</table>';
  // 谱带定位条
  out+='<table><tr><th>当前在百分位谱带中的位置（P85 → P95 → 120% → 140%）</th></tr>';
  out+='<tr><td><div class="bar" style="position:relative;height:14px;background:#F0F3F6">'
    +'<i style="position:absolute;left:0;width:'+p85p+'%;background:var(--ok)"></i>'
    +'<i style="position:absolute;left:'+p85p+'%;width:'+(p95p-p85p)+'%;background:var(--over)"></i>'
    +'<i style="position:absolute;left:'+p95p+'%;width:'+(p120p-p95p)+'%;background:var(--c1)"></i>'
    +'<i style="position:absolute;left:'+p120p+'%;width:'+(100-p120p)+'%;background:var(--c2)"></i>'
    +'<i style="position:absolute;left:'+Math.min(100,(bmi/maxX)*100)+'%;width:4px;height:14px;background:#111;border-radius:2px;top:0"></i>'
    +'</div></td></tr></table>';
if(severe){
    out+='<div class="sev">重度肥胖：BMI ≥ 120%×P95（'+thr120.toFixed(2)+'）或 BMI≥35，需专科强化干预</div>';
  }
  out+='<div class="note">参考（AAP/USPSTF）：强化生活方式干预 IHBLT 为一线；3–12 个月累计 ≥26 学时；重度肥胖可考虑专科评估。本结果仅作筛查定位，请结合临床。</div>';
  document.getElementById('result').innerHTML=out;
  document.getElementById('result').className='result show';

  drawChart(sex, months, bmi, P85, P95);
}

// ---- ECharts 生长曲线 ----
let chartInst=null;
function drawChart(sex, months, bmi, P85, P95){
  const dom=document.getElementById('chart');
  const table=sex==='boy'?BOYS:GIRLS;
  const xs=[],p5=[],p85=[],p95=[];
  for(let ag=24;ag<=144;ag++){
    const [a,l,m,s]=interp(table, ag);
    xs.push((ag/12).toFixed(1));
    p5.push(+bmiAtZ(l,m,s,-1.645).toFixed(2));
    p85.push(+bmiAtZ(l,m,s,1.036).toFixed(2));
    p95.push(+bmiAtZ(l,m,s,1.645).toFixed(2));
  }
  if(!chartInst){chartInst=echarts.init(dom);}
  chartInst.setOption({
    grid:{left:46,right:18,top:36,bottom:30},
    tooltip:{trigger:'axis',valueFormatter:v=>v+' kg/m²'},
title:{text:'BMI-for-Age 生长曲线（'+ (sex==='boy'?'男':'女') +'）',left:0,top:0,textStyle:{fontSize:13,color:'#1C2B33'}},
    legend:{data:['P5','P85','P95','本患儿'],top:0,right:0,icon:'roundRect',itemWidth:12,itemHeight:8,textStyle:{fontSize:11}},
    xAxis:{type:'category',data:xs,name:'岁',nameLocation:'middle',nameGap:28,axisLabel:{fontSize:10,interval:11},boundaryGap:false},
    yAxis:{type:'value',name:'BMI',nameTextStyle:{fontSize:11},axisLabel:{fontSize:10},scale:true},
    series:[
      {name:'P5',type:'line',data:p5,showSymbol:false,lineStyle:{width:1.2,color:'#9FB3C8'},itemStyle:{color:'#9FB3C8'}},
      {name:'P85',type:'line',data:p85,showSymbol:false,lineStyle:{width:1.6,color:'#C98A1B'},itemStyle:{color:'#C98A1B'}},
      {name:'P95',type:'line',data:p95,showSymbol:false,lineStyle:{width:1.6,color:'#C83C3C'},itemStyle:{color:'#C83C3C'}},
      {name:'本患儿',type:'scatter',symbolSize:16,itemStyle:{color:'#14606B',borderColor:'#fff',borderWidth:2},data:[[(months/12).toFixed(1),+bmi.toFixed(2)]]}
]
  });
}
window.addEventListener('resize',()=>{chartInst&&chartInst.resize();});

// ---- 状态与交互 ----
const state={sex:'boy',yr:8,mo:0};
function fillAge(){
  const ys=document.getElementById('ageYr'), ms=document.getElementById('ageMo');
  ys.innerHTML='';ms.innerHTML='';
  AGE_YEARS.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y+' 岁';ys.appendChild(o);});
  for(let m=0;m<12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+' 月';ms.appendChild(o);}
  ys.value=state.yr;ms.value=state.mo;
}
function init(){
  fillAge();
  document.getElementById('ageYr').addEventListener('change',e=>{state.yr=+e.target.value;});
  document.getElementById('ageMo').addEventListener('change',e=>{state.mo=+e.target.value;});
  document.getElementById('sexBoy').addEventListener('click',()=>setSex('boy'));
  document.getElementById('sexGirl').addEventListener('click',()=>setSex('girl'));
  document.getElementById('calc').addEventListener('click',compute);
  ['h','w'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{if(document.getElementById('h').value&&document.getElementById('w').value)compute();}));
}
function setSex(s){
  state.sex=s;
  document.getElementById('sexBoy').className=s==='boy'?'on':'';
  document.getElementById('sexGirl').className=s==='girl'?'on':'';
  compute();
}
init();
</script>
