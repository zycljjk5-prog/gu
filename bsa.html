<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>许文生公式｜儿童体表面积计算器</title>
    <style>
        *{box-sizing:border-box;font-family:system-ui}
        body{max-width:520px;margin:3rem auto;padding:0 20px;}
        .box{border:1px #ddd solid;padding:24px;border-radius:12px;box-shadow:0 2px 8px #eee}
        h3{color:#225;}
        .formula{background:#f0f7ff;padding:12px;border-radius:8px;margin:12px 0;font-size:16px}
        .row{margin:14px 0}
        label{display:block;margin-bottom:6px}
        input{width:100%;padding:9px;border:1px #ccc solid;border-radius:6px;font-size:16px}
        button{width:100%;padding:11px;background:#2374e1;color:#fff;border:none;border-radius:6px;font-size:16px;margin-top:8px;cursor:pointer}
        #res{margin-top:16px;padding:12px;background:#f8fff8;border-radius:8px;font-size:17px}
    </style>
</head>
<body>
<div class="box">
    <h3>儿童体表面积BSA（许文生公式）</h3>
    <div class="formula">
        BSA(m²) = 0.0061×身高(cm) + 0.0128×体重(kg) − 0.1529
    </div>

    <div class="row">
        <label>身高(cm)</label>
        <input id="height" type="number" placeholder="例如：110">
    </div>
    <div class="row">
        <label>体重(kg)</label>
        <input id="weight" type="number" placeholder="例如：20">
    </div>

    <button onclick="calc()">计算体表面积</button>
    <div id="res"></div>
</div>

<script>
function calc(){
    let h = parseFloat(document.getElementById('height').value);
    let w = parseFloat(document.getElementById('weight').value);
    if(isNaN(h)||isNaN(w)||h<=0||w<=0){
        document.getElementById('res').innerText = '请输入有效的身高、体重数值';
        return;
    }
    let bsa = 0.0061*h + 0.0128*w - 0.1529;
    let low = (bsa*10).toFixed(2);
    let high = (bsa*12).toFixed(2);
    let stressLow = (bsa*15).toFixed(2);
    let stressHigh = (bsa*20).toFixed(2);

    let txt = `体表面积：${bsa.toFixed(4)} m²\n
● 氢化可的松【生理维持量】：${low} ~ ${high} mg/日
● 急性期应激剂量：${stressLow} ~ ${stressHigh} mg/日
用法：一日3次，晨起2/3，午、晚各1/3`;
    document.getElementById('res').innerText = txt;
}
</script>
</body>
</html>
