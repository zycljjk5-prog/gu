        }

                    </select>

        <div class="selection-area">

                    <option value="absence">失神发作</option>
                    <option value="myoclonic">肌阵挛发作</option>
                    <option value="focal">局灶性发作</option>
                </select>
            </div>
            
            <div class="selection-group">
                <label for="syndrome-type">选择癫痫综合征：</label>

                    <option value="">请选择癫痫综合征</option>

                    <option value="generalized-tonic-clonic-only">仅有全面强直阵挛发作的癫痫</option>

                    <option value="dravet-syndrome">Dravet综合征</option>

                    <option value="myoclonic-atonic">肌阵挛-失张力癫痫</option>
                </select>
            </div>
        </div>

            </div>
        </div>

        </footer>
    </div>

            "ARX": {
                syndrome: "west-syndrome",
                info: "ARX基因突变与X连锁婴儿痉挛症相关。",
                recommended: ["皮质激素", "氨己烯酸*", "丙戊酸"],
                avoid: []
            },
            "其他": {
                syndrome: "",
                info: "该基因的癫痫药物基因组学信息有限，请参考常规癫痫综合征选药原则。",
                recommended: [],
                avoid: []
            }
        };

        // 获取DOM元素
        const geneNameSelect = document.getElementById('gene-name');
        const mutationTypeSelect = document.getElementById('mutation-type');
        const analyzeBtn = document.getElementById('analyze-btn');
        const seizureTypeSelect = document.getElementById('seizure-type');
        const syndromeTypeSelect = document.getElementById('syndrome-type');
        const resultArea = document.getElementById('result-area');
        const selectedCondition = document.getElementById('selected-condition');
        const geneInfo = document.getElementById('gene-info');
        const firstLineMeds = document.getElementById('first-line-meds');
        const addOnMeds = document.getElementById('add-on-meds');
        const considerMeds = document.getElementById('consider-meds');
        const worsenMeds = document.getElementById('worsen-meds');

        // 监听选择变化
        function updateDisplay() {
            const seizureValue = seizureTypeSelect.value;
            const syndromeValue = syndromeTypeSelect.value;
            
            // 优先显示癫痫综合征的选择
            if (syndromeValue) {
                displayCondition(syndromeData[syndromeValue], "癫痫综合征");
                // 清空发作类型选择
                seizureTypeSelect.value = "";
            } else if (seizureValue) {
                displayCondition(seizureData[seizureValue], "发作类型");
            } else {
                // 隐藏结果区域
                resultArea.style.display = 'none';
            }
        }

        // 显示条件的函数
        function displayCondition(condition, type) {
            // 显示结果区域
            resultArea.style.display = 'block';
            
            // 更新条件名称
            selectedCondition.textContent = `${type}: ${condition.name}`;
            
            // 清空基因信息（除非有基因分析结果）
            if (!geneInfo.dataset.hasAnalysis) {
                geneInfo.innerHTML = "<p>请输入基因信息获取个性化用药建议</p>";
                geneInfo.dataset.hasAnalysis = "false";
            }
            
            // 更新药物列表
            updateMedicationList(firstLineMeds, condition.firstLine);
            updateMedicationList(addOnMeds, condition.addOn);
            updateMedicationList(considerMeds, condition.consider);
            updateMedicationList(worsenMeds, condition.worsen);
        }

        // 基因分析功能
        analyzeBtn.addEventListener('click', function() {
            const geneName = geneNameSelect.value;
            const mutationType = mutationTypeSelect.value;
            
            if (!geneName) {
                alert("请选择基因名称");
                return;
            }
            
            if (geneData[geneName]) {
                const geneInfoData = geneData[geneName];
                
                // 显示基因分析结果
                geneInfo.innerHTML = `
                    <h3>基因分析结果: ${geneName} ${mutationType ? `(${mutationType}突变)` : ''}</h3>
                    <p>${geneInfoData.info}</p>
                    <p><strong>相关综合征:</strong> ${syndromeData[geneInfoData.syndrome]?.name || '未知'}</p>
                    <p><strong>基于基因的推荐药物:</strong> ${geneInfoData.recommended.join(', ') || '无特定推荐'}</p>
                    ${geneInfoData.avoid.length > 0 ? `<p><strong>基于基因应避免的药物:</strong> ${geneInfoData.avoid.join(', ')}</p>` : ''}
                `;
                geneInfo.dataset.hasAnalysis = "true";
                
                // 自动选择相关综合征
                if (geneInfoData.syndrome) {
                    syndromeTypeSelect.value = geneInfoData.syndrome;
                    seizureTypeSelect.value = "";
                }
                
                // 更新显示
                updateDisplay();
            }
        });

        // 更新药物列表的函数
        function updateMedicationList(container, medications) {
            // 清空容器
            container.innerHTML = '';
            
            // 如果没有药物，显示提示
            if (medications.length === 0) {
                const noMeds = document.createElement('div');
                noMeds.textContent = '暂无相关药物';
                noMeds.style.color = '#999';
                noMeds.style.fontStyle = 'italic';
                container.appendChild(noMeds);
                return;
            }
            
            // 添加药物项
            medications.forEach(med => {
                const medItem = document.createElement('div');
                medItem.className = 'medication-item';
                medItem.textContent = med;
                container.appendChild(medItem);
            });
        }

        // 添加事件监听器
        seizureTypeSelect.addEventListener('change', function() {
            if (this.value) {
                syndromeTypeSelect.value = "";
                geneInfo.dataset.hasAnalysis = "false";
            }
            updateDisplay();
        });
        
        syndromeTypeSelect.addEventListener('change', function() {
            if (this.value) {
                seizureTypeSelect.value = "";
                geneInfo.dataset.hasAnalysis = "false";
            }
            updateDisplay();
        });
        
        // 初始化时隐藏结果区域
        resultArea.style.display = 'none';
    </script>
</body>
</html>
