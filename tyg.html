<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>TyG指数计算器 · 移动优化版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #d9e6f2;  /* 柔和背景 */
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: #ffffffec;
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 28px 22px;
            box-shadow: 0 25px 45px -20px #1e405b, 0 2px 0 0 #ffffff inset, 0 0 0 1px #cfdef1;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .title {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .title h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #0d2e48;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .badge {
            background: #1a405e;
            color: white;
            padding: 6px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            background: linear-gradient(145deg, #1d4870, #123a58);
            box-shadow: 0 6px 12px -6px #0d314a;
            white-space: nowrap;
        }

        .formula-note {
            background: #e3f0fd;
            padding: 12px 20px;
            border-radius: 40px;
            margin: 12px 0 28px 0;
            font-size: 1.1rem;
            font-weight: 500;
            color: #0f3a5a;
            border: 1px solid #bbd4f0;
            box-shadow: inset 0 1px 5px white;
            text-align: center;
            word-break: break-word;
        }

        .formula-note strong {
            background: #0a2a44;
            color: white;
            padding: 5px 16px;
            border-radius: 40px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            margin: 0 4px;
            font-size: 1rem;
        }

        /* 输入区域 —— 块状堆叠，保证完整显示 */
        .input-block {
            margin-bottom: 26px;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1.2rem;
            color: #143651;
            margin-bottom: 8px;
            padding-left: 6px;
        }

        .input-label small {
            font-weight: 400;
            font-size: 0.9rem;
            color: #4f759b;
        }

        /* 数值行：输入框 + 单位按钮 完全可见，不溢出 */
        .value-row {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 60px;
            border: 2px solid #c0d2e9;
            transition: 0.2s;
            width: 100%;
            overflow: hidden;  /* 防止圆角溢出，但不裁剪内容 */
        }

        .value-row:focus-within {
            border-color: #1e6aab;
            box-shadow: 0 0 0 4px rgba(25, 110, 180, 0.2);
        }

        .value-row input {
            flex: 1 1 0;
            min-width: 0;      /* 关键：允许收缩，防止撑大 */
            padding: 16px 18px;
            font-size: 1.2rem;
            border: none;
            background: transparent;
            outline: none;
            font-weight: 500;
            color: #0e314b;
            width: 100%;       
        }

        .value-row input::placeholder {
            color: #99b5d3;
            font-size: 1rem;
        }

        /* 单位按钮组 - 不换行，稳稳靠在右侧 */
        .unit-group {
            display: flex;
            gap: 6px;
            padding-right: 12px;
            flex-shrink: 0;    /* 禁止压缩，保证按钮完整 */
        }

        .unit-btn {
            background: #e5eef9;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            color: #1f4a73;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid transparent;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .unit-btn.active {
            background: #1b3f5e;
            color: white;
            border-color: #0d263b;
            box-shadow: 0 6px 12px -6px #123652;
        }

        .hint-text {
            font-size: 0.8rem;
            color: #476c8f;
            margin-left: 20px;
            margin-top: 6px;
        }

        .action-row {
            display: flex;
            gap: 15px;
            margin: 32px 0 28px;
        }

        .btn-calc {
            background: #123f61;
            border: none;
            padding: 18px 25px;
            border-radius: 60px;
            color: white;
            font-size: 1.4rem;
            font-weight: 700;
            flex: 2;
            cursor: pointer;
            box-shadow: 0 15px 25px -12px #0e3c5e;
            transition: 0.1s;
            border: 1px solid #3675a5;
            letter-spacing: 0.5px;
        }

        .btn-calc:hover {
            background: #19547c;
        }

        .btn-reset {
            background: white;
            border: 2px solid #b7cde4;
            padding: 18px 15px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.2rem;
            color: #1e4567;
            flex: 1;
            cursor: pointer;
        }

        .result-area {
            background: #e2edfd;
            border-radius: 36px;
            padding: 24px 22px;
            border: 1px solid white;
            box-shadow: inset 0 2px 12px #ffffff, 0 12px 28px -18px #153f60;
        }

        .tyg-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .tyg-label {
            font-size: 1.5rem;
            font-weight: 600;
            color: #133856;
        }

        .tyg-value {
            font-size: 3.2rem;
            font-weight: 800;
            background: white;
            padding: 5px 32px;
            border-radius: 80px;
            color: #0a2a44;
            border: 1px solid #bed2f0;
            box-shadow: 0 10px 18px -14px #1c5480;
            line-height: 1.3;
        }

        .interpret {
            font-size: 1.35rem;
            background: #ffffffee;
            padding: 12px 24px;
            border-radius: 50px;
            margin: 20px 0 18px;
            font-weight: 600;
            color: #113753;
            border: 1px solid #cddefa;
        }

        .quartile-box {
            background: #1b3e5c;
            border-radius: 28px;
            padding: 18px 20px;
            color: white;
            margin-top: 16px;
        }

        .quartile-box table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            margin-top: 10px;
        }

        .quartile-box td {
            padding: 8px 5px;
            border-bottom: 1px solid #34668a;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #55799b;
            margin-top: 18px;
        }

        .error-message {
            background: #fbc1c1;
            color: #a03636;
            padding: 12px 22px;
            border-radius: 60px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="title">
            <h1>TyG 指数</h1>
        </div>
        <div class="formula-note">
            ⚡ 公式 <strong>ln[TG × FBG / 2]</strong> (单位:mg/dL)
        </div>

        <!-- 甘油三酯区块 (完整显示) -->
        <div class="input-block">
            <div class="input-label">
                <span>🧪 甘油三酯 (TG)</span>
                <small>空腹</small>
            </div>
            <div class="value-row">
                <input type="number" id="tgInput" step="any" placeholder="例: 1.8 mmol/L 或 160 mg/dL" value="1.7">
                <div class="unit-group" id="tgUnitGroup">
                    <button type="button" class="unit-btn active" data-unit="mmol">mmol/L</button>
                    <button type="button" class="unit-btn" data-unit="mg">mg/dL</button>
                </div>
            </div>
            <div class="hint-text">换算: 1 mmol/L ≈ 88.57 mg/dL</div>
        </div>

        <!-- 血糖区块 (完整显示) -->
        <div class="input-block">
            <div class="input-label">
                <span>🩸 空腹血糖 (FBG)</span>
                <small>静脉血</small>
            </div>
            <div class="value-row">
                <input type="number" id="gluInput" step="any" placeholder="例: 5.5 mmol/L 或 99 mg/dL" value="5.3">
                <div class="unit-group" id="gluUnitGroup">
                    <button type="button" class="unit-btn active" data-unit="mmol">mmol/L</button>
                    <button type="button" class="unit-btn" data-unit="mg">mg/dL</button>
                </div>
            </div>
            <div class="hint-text">换算: 1 mmol/L = 18.02 mg/dL</div>
        </div>

        <!-- 按钮区 -->
        <div class="action-row">
            <button class="btn-calc" id="calcBtn">计算 TyG</button>
            <button class="btn-reset" id="clearBtn">重置</button>
        </div>

        <!-- 结果显示区 -->
        <div class="result-area">
            <div class="tyg-row">
                <span class="tyg-label">TyG 指数</span>
                <span class="tyg-value" id="tygDisplay">—</span>
            </div>
            <div id="interpretBox" class="interpret"></div>

            <div class="quartile-box">
                <div style="font-weight: 700; font-size: 1.15rem; margin-bottom: 5px;">📊 四分位参考 (高校教师)</div>
                <table>
                    <tr><td>总人群 Q1</td><td>&lt; 6.55</td><td>总人群 Q4</td><td>≥ 7.29</td></tr>
                    <tr><td>男性 Q1</td><td>&lt; 6.74</td><td>男性 Q4</td><td>≥ 7.47</td></tr>
                    <tr><td>女性 Q1</td><td>&lt; 6.43</td><td>女性 Q4</td><td>≥ 7.12</td></tr>
                </table>
            </div>
        </div>
        <div class="footer-note">
            * 根据 ln(TGmg × FBGmg / 2) 计算，仅供参考。
        </div>
    </div>
</div>

<script>
    (function() {
        // DOM
        const tgInput = document.getElementById('tgInput');
        const gluInput = document.getElementById('gluInput');
        const tgUnitGroup = document.getElementById('tgUnitGroup');
        const gluUnitGroup = document.getElementById('gluUnitGroup');
        const calcBtn = document.getElementById('calcBtn');
        const clearBtn = document.getElementById('clearBtn');
        const tygDisplay = document.getElementById('tygDisplay');
        const interpretBox = document.getElementById('interpretBox');

        // 当前单位
        let tgUnit = 'mmol';
        let gluUnit = 'mmol';

        // 获取所有单位按钮并更新状态
        function refreshUnitUI() {
            document.querySelectorAll('#tgUnitGroup .unit-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.unit === tgUnit);
            });
            document.querySelectorAll('#gluUnitGroup .unit-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.unit === gluUnit);
            });
        }

        // 为甘油三酯单位绑定事件
        tgUnitGroup.querySelectorAll('.unit-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                tgUnit = btn.dataset.unit;
                refreshUnitUI();
            });
        });

        // 为血糖单位绑定事件
        gluUnitGroup.querySelectorAll('.unit-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                gluUnit = btn.dataset.unit;
                refreshUnitUI();
            });
        });

        // 转换到 mg/dL
        function toMgDl(value, unit, type) {
            if (unit === 'mmol') {
                if (type === 'tg') return value * 88.57;
                if (type === 'glu') return value * 18.02;
            }
            return value; // 已经是 mg/dL
        }

        // 计算主函数
        function calculate() {
            const tgRaw = parseFloat(tgInput.value);
            const gluRaw = parseFloat(gluInput.value);

            // 校验
            if (isNaN(tgRaw) || tgRaw <= 0) {
                interpretBox.innerHTML = '<span class="error-message">❌ 甘油三酯必须是正数</span>';
                tygDisplay.textContent = '—';
                return;
            }
            if (isNaN(gluRaw) || gluRaw <= 0) {
                interpretBox.innerHTML = '<span class="error-message">❌ 血糖必须是正数</span>';
                tygDisplay.textContent = '—';
                return;
            }

            const tgMg = toMgDl(tgRaw, tgUnit, 'tg');
            const gluMg = toMgDl(gluRaw, gluUnit, 'glu');

            const productHalf = (tgMg * gluMg) / 2;
            if (productHalf <= 0) {
                interpretBox.innerHTML = '<span class="error-message">❌ 数值无效</span>';
                tygDisplay.textContent = '—';
                return;
            }

            const tyg = Math.log(productHalf);  // ln(TG*FBG/2)

            if (!isFinite(tyg)) {
                interpretBox.innerHTML = '<span class="error-message">❌ 计算溢出</span>';
                tygDisplay.textContent = '—';
                return;
            }

            // 显示TyG保留3位小数
            tygDisplay.textContent = tyg.toFixed(3);

            // 解释
            let interpretation = '';
            if (tyg < 6.4) interpretation = '🟢 较低 (胰岛素敏感性好)';
            else if (tyg >= 6.4 && tyg < 6.9) interpretation = '🟡 中等 (存在一定抵抗风险)';
            else if (tyg >= 6.9 && tyg < 7.3) interpretation = '🟠 偏高 (胰岛素抵抗可能性增加)';
            else if (tyg >= 7.3) interpretation = '🔴 很高 (强烈提示胰岛素抵抗)';
            else interpretation = '计算完成';

            // 显示单位参考
            const tgUnitLabel = tgUnit === 'mmol' ? 'mmol/L' : 'mg/dL';
            const gluUnitLabel = gluUnit === 'mmol' ? 'mmol/L' : 'mg/dL';
            interpretation += `<span style="font-size:0.85rem; font-weight:400; display:block; margin-top:7px; color:#1a4e78;">TG = ${tgRaw.toFixed(2)} ${tgUnitLabel} · 血糖 = ${gluRaw.toFixed(2)} ${gluUnitLabel}</span>`;
            interpretBox.innerHTML = interpretation;
        }

        // 重置到默认示例
        function resetToDefault() {
            tgInput.value = '1.7';
            gluInput.value = '5.3';
            tgUnit = 'mmol';
            gluUnit = 'mmol';
            refreshUnitUI();
            tygDisplay.textContent = '—';
            interpretBox.innerHTML = '';
        }

        // 绑定按钮
        calcBtn.addEventListener('click', (e) => {
            e.preventDefault();
            calculate();
        });

        clearBtn.addEventListener('click', (e) => {
            e.preventDefault();
            resetToDefault();
        });

        // 支持回车
        [tgInput, gluInput].forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    calcBtn.click();
                }
            });
        });

        // 页面初始化显示默认计算结果
        window.addEventListener('load', () => {
            refreshUnitUI();
            // 轻微延迟确保渲染
            setTimeout(calculate, 20);
        });
    })();
</script>
</body>
</html>
