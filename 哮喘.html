<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>哮喘持续状态用药剂量计算器-张永超医生自用</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#f3f4f6; margin:0; padding:20px; }
    .card { max-width:900px; margin:20px auto; background:#fff; border-radius:16px; box-shadow:0 6px 18px rgba(0,0,0,0.08); padding:24px; }
    h1 { margin:0 0 8px; font-size:20px; }
    p.lead { color:#6b7280; margin:0 0 16px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:12px; }
    label { display:block; font-size:13px; color:#374151; margin-bottom:6px; }
    input[type="number"], select { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; box-sizing:border-box; }
    .result { background:#f3f4f6; padding:12px; border-radius:8px; margin-top:8px; }
    .note { font-size:13px; color:#6b7280; margin-top:6px; }
    .warning { color:#b91c1c; font-size:13px; margin-top:10px; }
    footer { font-size:13px; color:#6b7280; margin-top:12px; }
    .btn { padding:8px 12px; border-radius:8px; background:#111827; color:#fff; border:none; cursor:pointer; }
    .small { font-size:13px; color:#374151; }
  </style>
</head>
<body>
  <div class="card">
    <h1>哮喘持续状态用药剂量在线计算器-张永超医生自用</h1>
    <p class="lead">输入体重并选择药物，计算常见参考剂量（仅供参考）。</p>

    <div class="grid">
      <div>
        <label for="weight">体重 (kg)</label>
        <input id="weight" type="number" step="0.1" min="0" placeholder="例如: 12.5" />
      </div>

      <div>
        <label for="age">年龄 (可选)</label>
        <input id="age" type="number" step="1" min="0" placeholder="年龄(岁)" />
      </div>

      <div>
        <label for="med">选择药物</label>
        <select id="med">
          <option value="methylprednisolone">甲泼尼龙 (Methylprednisolone)</option>
          <option value="hydrocortisone">氢化可的松 (Hydrocortisone)</option>
          <option value="dexamethasone">地塞米松 (Dexamethasone)</option>
          <option value="aminophylline">氨茶碱/安可林 (Aminophylline)</option>
          <option value="magnesium">硫酸镁 (Magnesium sulfate)</option>
          <option value="epinephrine">肾上腺素 1:1000 (Epinephrine, SC/IM)</option>
        </select>
      </div>
    </div>

    <div>
      <button class="btn" id="calcBtn">计算剂量</button>
    </div>

    <div class="result" id="result">
      请输入有效体重以显示剂量。
    </div>

    <div class="note" id="note"></div>

    <div class="warning">
      <strong>重要声明：</strong> 本计算器基于常见临床参考范围，仅供教育参考，不能替代临床判断。用药前请务必核对处方、制剂浓度以及当地指南并咨询负责医师或药师。
    </div>

    <footer>
      参考：基于常见急诊/儿科指南剂量范围。对儿童、孕妇、肾功能不全或合并用药者需特别谨慎。
    </footer>
  </div>

<script>
(function(){
  const meds = {
    methylprednisolone: {
      label: '甲泼尼龙 (Methylprednisolone)',
      calc: (kg) => {
        const low = (1 * kg).toFixed(2);
        const high = (2 * kg).toFixed(2);
        return `${low} - ${high} mg 每次`;
      },
      note: '常用 1–2 mg/kg 每次, 视情况每8–24小时给药；以临床指南为准。'
    },
    hydrocortisone: {
      label: '氢化可的松 (Hydrocortisone)',
      calc: (kg) => {
        const low = Math.round(5 * kg);
        const high = Math.round(10 * kg);
        return `${low} - ${high} mg 每次`;
      },
      note: '常见急性哮喘用量范围 5–10 mg/kg (有不同指南建议)。'
    },
    dexamethasone: {
      label: '地塞米松 (Dexamethasone)',
      calc: (kg) => {
        const low = (0.3 * kg).toFixed(2);
        const high = (0.6 * kg).toFixed(2);
        return `${low} - ${high} mg（单次或每日）`;
      },
      note: '常见短程剂量 0.3–0.6 mg/kg。'
    },
    aminophylline: {
      label: '氨茶碱/安可林 (Aminophylline)',
      calc: (kg) => {
        const loadLow = (4 * kg).toFixed(2);
        const loadHigh = (6 * kg).toFixed(2);
        const maintLow = (0.7 * kg).toFixed(2);
        const maintHigh = (1 * kg).toFixed(2);
        return `负荷: ${loadLow} - ${loadHigh} mg；维持输注示例: ${maintLow} - ${maintHigh} mg/hr`;
      },
      note: '负荷通常 4–6 mg/kg；维持输注需按血药浓度调整。'
    },
    magnesium: {
      label: '硫酸镁 (Magnesium sulfate)',
      calc: (kg) => {
        const low = Math.round(25 * kg);
        const high = Math.min(Math.round(75 * kg), 2000);
        return `${low} - ${high} mg（单次, 最大 2000 mg），静脉滴注 20–30 分钟`;
      },
      note: '常用 25–75 mg/kg，单次最大约 2 g。'
    },
    epinephrine: {
      label: '肾上腺素 1:1000 (Epinephrine, SC/IM)',
      calc: (kg) => {
        const vol = (0.01 * kg).toFixed(2); // ml of 1:1000
        const doseMg = (0.01 * kg).toFixed(3); // mg
        const maxVol = 0.3;
        return `体积: ${vol} ml (1:1000)，相当于 ${doseMg} mg；每 20 分钟可重复，单次体积不超过 ${maxVol} ml`;
      },
      note: '按体重和制剂浓度计算，遵循急救规范。'
    }
  };

  const weightEl = document.getElementById('weight');
  const ageEl = document.getElementById('age');
  const medEl = document.getElementById('med');
  const resultEl = document.getElementById('result');
  const noteEl = document.getElementById('note');
  const btn = document.getElementById('calcBtn');

  function calc() {
    const kg = parseFloat(weightEl.value);
    if (!(kg > 0)) {
      resultEl.textContent = '请输入有效体重以显示剂量。';
      noteEl.textContent = '';
      return;
    }
    const medKey = medEl.value;
    const m = meds[medKey];
    resultEl.textContent = m.calc(kg);
    noteEl.textContent = '说明: ' + m.note;
  }

  btn.addEventListener('click', calc);
  // allow Enter on weight input
  weightEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') calc(); });

})();
</script>

</body>
</html>
