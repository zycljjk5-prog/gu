<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儿童哮喘风险自评 · 危险因素评估</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f7fb 0%, #e6f0f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            margin: 0;
        }
        .card {
            max-width: 800px;
            width: 100%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 20, 40, 0.35), inset 0 1px 2px rgba(255,255,255,0.6);
            padding: 2rem 2rem 2.2rem;
            border: 1px solid rgba(255,255,255,0.7);
            transition: all 0.2s ease;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #0b3954;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
        }
        h1 span {
            background: #0b3954;
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            letter-spacing: 0.3px;
            vertical-align: middle;
        }
        .subhead {
            color: #2c5775;
            font-size: 1rem;
            border-left: 4px solid #7ab3c9;
            padding-left: 1rem;
            margin: 0.5rem 0 1.5rem 0;
            font-weight: 400;
            background: rgba(138, 188, 210, 0.1);
            border-radius: 0 8px 8px 0;
        }
        .badge-info {
            background: #e2ebf3;
            color: #0b3954;
            font-size: 0.85rem;
            padding: 0.35rem 1rem;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            margin-bottom: 1.5rem;
        }
        .section {
            background: #ffffffd9;
            border-radius: 1.8rem;
            padding: 1.4rem 1.5rem;
            margin-bottom: 1.7rem;
            box-shadow: 0 6px 14px rgba(29, 60, 80, 0.08);
            border: 1px solid #ffffff;
        }
        .section-title {
            font-weight: 600;
            font-size: 1.3rem;
            color: #0f3f58;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-title i {
            font-size: 1.5rem;
            color: #2f88b0;
        }
        .factor-grid {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }
        .factor-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.2rem 0;
            border-bottom: 1px dashed #d3e3ed;
        }
        .factor-item:last-child {
            border-bottom: none;
        }
        .factor-item label {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex: 1;
            cursor: pointer;
            font-size: 1rem;
            color: #1c445b;
            font-weight: 450;
        }
        .factor-item input[type="checkbox"] {
            width: 1.2rem;
            height: 1.2rem;
            accent-color: #1f7ca0;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.1s;
        }
        .factor-tag {
            background: #eef5f9;
            border-radius: 30px;
            padding: 0.2rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1d6180;
            white-space: nowrap;
        }
        .risk-summary {
            background: linear-gradient(120deg, #edf5fa, #ddecf5);
            border-radius: 1.8rem;
            padding: 1.8rem 1.8rem;
            margin: 1.8rem 0 1.2rem;
            border: 1px solid rgba(62, 135, 175, 0.25);
        }
        .risk-level {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
        }
        .risk-badge {
            font-size: 2.2rem;
            font-weight: 650;
            letter-spacing: 1px;
            background: #0b3954;
            color: white;
            padding: 0.3rem 1.8rem;
            border-radius: 60px;
            display: inline-block;
            box-shadow: 0 8px 14px -6px #0b395470;
        }
        .risk-desc {
            font-size: 1.2rem;
            color: #043349;
            font-weight: 500;
        }
